name: Sus-O-Meter CI and Scan CD

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scan_directory:
        description: "Workspace-relative folder containing the files"
        required: true
        type: string
        default: sus-scanning-files
      report_directory:
        description: "Workspace-relative report folder (must not overlap scan folder)"
        required: true
        type: string
        default: pipeline-reports
      report_name:
        description: "Report filename stem: letters, digits, underscores, hyphens"
        required: true
        type: string
        default: sus-o-meter-scan
      dry_run:
        description: "Hash locally only: no VirusTotal, quarantine, or source changes"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ci:
    name: CI · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test, lint, format, check dependencies, and build
        env:
          CI_PYTHON: ${{ matrix.python }}
        run: python -m sus_o_meter.pipeline ci
      - name: Preserve quality-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-evidence-${{ matrix.python }}
          path: .pipeline-ci/${{ matrix.python }}/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  ci-report:
    name: CI · Inspection ledger
    needs: ci
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - name: Gather matrix evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ci-evidence-*
          path: .pipeline-inputs
      - name: Normalize evidence directory names
        run: |
          python - <<'PY'
          from pathlib import Path
          for directory in Path(".pipeline-inputs").glob("ci-evidence-*"):
              directory.rename(directory.with_name(directory.name.removeprefix("ci-evidence-")))
          PY
      - name: Publish styled CI report and job summary
        id: report
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: python -m sus_o_meter.pipeline ci-report
      - name: Upload CI report
        if: ${{ always() && steps.report.outputs.artifact_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-inspection-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.report.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  scan-cd:
    name: CD · CI-approved scan
    needs: [ci, ci-report]
    if: >-
      ${{ !cancelled() && needs.ci.result == 'success' && needs.ci-report.result == 'success' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
           (github.event_name == 'workflow_dispatch' &&
            (inputs.dry_run || github.ref == 'refs/heads/main'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python -m pip install -e .
      - name: Scan or dry-run and publish outcome report
        id: scan
        env:
          SCAN_DIR: ${{ inputs.scan_directory || 'sus-scanning-files' }}
          REPORT_DIR: ${{ inputs.report_directory || 'pipeline-reports' }}
          REPORT_NAME: ${{ inputs.report_name || 'sus-o-meter-scan' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          AUTOMATIC: ${{ github.event_name == 'push' && 'true' || 'false' }}
          # No API secret is exposed to PR CI, branch dry runs, or main dry runs.
          VT_API_KEY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || !inputs.dry_run) && secrets.VT_API_KEY || '' }}
        run: python -m sus_o_meter.pipeline scan
      - name: Upload metadata reports only
        if: ${{ always() && steps.scan.outputs.artifact_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scan-inspection-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.scan.outputs.artifact_path }}/*.html
            ${{ steps.scan.outputs.artifact_path }}/*.json
            ${{ steps.scan.outputs.artifact_path }}/*.md
          if-no-files-found: error
          retention-days: 14
